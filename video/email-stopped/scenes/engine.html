<!doctype html>
<html><head><meta charset="utf-8"><title>The Day Email Stopped</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:1920px;height:1080px}
  #cap{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);max-width:1560px;width:max-content;text-align:center;
    font:600 40px/1.28 Arial, sans-serif;color:#fffaf0;background:rgba(22,20,28,0.82);padding:14px 34px 16px;border-radius:14px;opacity:0}
  #label{position:absolute;right:64px;top:56px;text-align:right;font:700 38px/1.15 Arial, sans-serif;color:#fffaf0;background:#1d1a24;padding:14px 26px 16px;
    border-right:10px solid #e9b949;max-width:820px;opacity:0}
  #title{position:absolute;inset:0 0 170px 0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font:900 92px/1.05 Arial Black, Arial, sans-serif;color:#fffaf0;text-align:center;padding:0 140px;letter-spacing:1px;text-shadow:0 6px 0 #1d1a24}
  #title .sub{font:700 44px/1.2 Arial, sans-serif;color:#e9b949;text-shadow:none;letter-spacing:0}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="label"></div><div id="title"></div><div id="cap"></div>
<script src="../lib/puppet.js"></script>
<script src="../lib/cast.js"></script>
<script type="module">
  import { makeBeat } from './engine.js';
  import { BEATS } from './beats/all.js';
  const q = new URLSearchParams(location.search), n = +q.get('beat');
  const narration = await (await fetch('./beats/narration.json')).json();
  const scene = makeBeat(BEATS[n], narration[n - 1]);
  await scene.setup(document.getElementById('c'));
  window.scene = scene;
  await scene.renderFrame(+(q.get('frame') || 0));
  window.ready = true;
</script>
</body></html>
