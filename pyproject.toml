[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aureous"
version = "0.1.0"
description = "Aureous: paper-trade Hyperliquid perps with live market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
aureous = "aureous.__main__:main"

[tool.setuptools]
packages = ["aureous"]

[tool.setuptools.package-data]
aureous = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
