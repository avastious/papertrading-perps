[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-papertrade"
version = "0.1.0"
description = "Paper-trade Hyperliquid perps with live market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hlpaper = "hlpaper.__main__:main"

[tool.setuptools]
packages = ["hlpaper"]

[tool.pytest.ini_options]
pythonpath = ["."]
