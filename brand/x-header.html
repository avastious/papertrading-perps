<!DOCTYPE html>
<!-- X / Twitter header, 1500x500. Left side kept clear for the profile picture that overlaps it. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(../aureous/web/fonts/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:"IBM Plex Sans";font-weight:500;src:url(../aureous/web/fonts/ibm-plex-sans-latin-500-normal.woff2)}
@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(../aureous/web/fonts/ibm-plex-sans-latin-600-normal.woff2)}
@font-face{font-family:"Cinzel";font-weight:600;src:url(../aureous/web/fonts/cinzel-latin-600-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden;background:#0B1018;color:#E6EBF1;font-family:"IBM Plex Sans",sans-serif;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;right:-200px;top:-260px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(227,179,65,.16),rgba(227,179,65,0))}
.left{position:absolute;left:330px;top:64px;width:560px}
.word{font-family:Cinzel,serif;font-weight:600;font-size:70px;letter-spacing:.09em;line-height:1}
.rule{width:64px;height:3px;background:#E3B341;margin:26px 0 24px}
h1{font-size:38px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
p{margin-top:16px;font-size:22px;color:#8592A3;line-height:1.4}
.coins{display:flex;gap:12px;position:absolute;right:72px;bottom:44px;align-items:center}
.coins span{font-size:22px;color:#8592A3;margin-left:10px}
.url{position:absolute;right:72px;top:40px;font-size:24px;color:#8592A3}
svg.chart{position:absolute;right:80px;top:70px}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="left">
  <div class="word">AUREOUS</div>
  <div class="rule"></div>
  <h1>Paper-trade Hyperliquid perps with live prices.</h1>
  <p>$10,000 to start. Real order books, a fair leaderboard and badges to earn.</p>
</div>
<svg class="chart" width="430" height="300" viewBox="0 0 430 360" id="chart"></svg>
<div class="coins" id="coins"></div>
<div class="url" id="url">aureous.pages.dev</div>
<script>
// a stylised rising candle chart
const svg = document.getElementById("chart"); let c = 250, x = 6, seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let out = "";
for (let i = 0; i < 26; i++) {
  const o = c, cl = o - 14 + rnd() * 22 - (i > 14 ? 6 : 0), hi = Math.min(o, cl) - 6 - rnd() * 14, lo = Math.max(o, cl) + 6 + rnd() * 14;
  const up = cl < o, col = up ? "#2FA57D" : "#DB5A55";
  out += `<line x1="${x + 6}" x2="${x + 6}" y1="${hi}" y2="${lo}" stroke="${col}" stroke-width="2"/>`;
  out += `<rect x="${x}" y="${Math.min(o, cl)}" width="12" height="${Math.max(3, Math.abs(cl - o))}" fill="${col}" rx="1"/>`;
  c = cl; x += 16;
}
out += `<line x1="0" x2="430" y1="${c}" y2="${c}" stroke="#E3B341" stroke-dasharray="4 5" stroke-width="2"/>`;
svg.innerHTML = out;
const tiers = [["#C27D4A", "S"], ["#BFC7D2", "D"], ["#E3B341", "A"], ["#E8A9A0", "S"], ["#A58BF5", "I"]];
document.getElementById("coins").innerHTML = tiers.map(([col, l]) =>
  `<svg width="44" height="44" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.2" fill="${col}"/><circle cx="10" cy="10" r="6.8" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1"/><text x="10" y="13.6" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="9" fill="rgba(0,0,0,.62)">${l}</text></svg>`).join("") + "<span>Badges from $20k to $1M</span>";
const q = new URLSearchParams(location.search).get("host"); if (q) document.getElementById("url").textContent = q;
</script>
</body></html>
